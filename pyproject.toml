[project]
name = "trading-bot"
version = "1.0.0"
description = "AI Trading Bot for Stock and Cryptocurrency Analysis"
requires-python = ">=3.10,<4.0"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "flask>=3.0",
    "flask-cors>=5.0.1",
    "uvicorn>=0.30",
    "asgiref>=3.8",

    # Data & analysis
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "optuna>=3.0",
    "yfinance>=0.2",
    "tradingview_ta>=3.3",
    "ta>=0.11",
    "prophet>=1.1",
    "pykalman>=0.9",

    # Notifications
    "python-telegram-bot>=21.0",
    "requests>=2.31",

    # NLP
    "textblob>=0.18",

    # Crypto
    "ccxt>=4.0",

    # Scheduling
    "apscheduler>=3.10",

    # Config
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["apps"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
strict_optional = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]


